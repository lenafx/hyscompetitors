<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 980" role="img" aria-labelledby="course-title course-desc">
  <title id="course-title">Up- and down</title>
  <desc id="course-desc">Windward/leeward. Start, 1a or 1b to port, mark 2, 1a or 1b to port, finish. Start and finish are the same line.</desc>

  <rect width="680" height="980" fill="#ffffff"/>
  <rect x="28" y="28" width="624" height="924" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>

  <rect x="28" y="28" width="624" height="64" fill="#5c5c5c"/>
  <line x1="118" y1="28" x2="118" y2="92" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="73" y="70" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">UD</text>
  <text x="370" y="68" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">COURSE: WINDWARD / LEEWARD</text>

  <rect x="28" y="92" width="90" height="58" fill="#efefef"/>
  <line x1="28" y1="92" x2="652" y2="92" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="118" y1="92" x2="118" y2="150" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="28" y1="150" x2="652" y2="150" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="73" y="128" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Order</text>
  <text x="385" y="128" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Start - 1a/1b - 2 - 1a/1b - Finish</text>

  <g transform="translate(118,220)" fill="#5c5c5c">
    <text y="0" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">WIND</text>
    <path d="M-5,8 H-1.8 V20 H-7 L0,36 L7,20 H1.8 V8 Z"/>
  </g>

  <!-- 1a: leave to port -->
  <path d="M 320,386 L 320,270 A 52,52 0 0,0 216,270 L 216,348" fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="0,-13 8,7 -8,7" fill="#7a7a7a" transform="translate(320,386)"/>
  <polygon points="0,13 8,-7 -8,-7" fill="#7a7a7a" transform="translate(216,360)"/>

  <!-- 1b: leave to port -->
  <path d="M 464,386 L 464,270 A 52,52 0 0,0 360,270 L 360,348" fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="0,-13 8,7 -8,7" fill="#7a7a7a" transform="translate(464,386)"/>
  <polygon points="0,13 8,-7 -8,-7" fill="#7a7a7a" transform="translate(360,360)"/>

  <!-- mark 2 as 2p: leave to port (down inside, under, up outside). no 2s -->
  <path d="M 272,478 L 272,530 A 68,68 0 0,0 408,530 L 408,468" fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="0,13 8,-7 -8,-7" fill="#7a7a7a" transform="translate(272,468)"/>
  <polygon points="0,-13 8,7 -8,7" fill="#7a7a7a" transform="translate(408,456)"/>

  <circle cx="268" cy="270" r="16" fill="#e07a2f" stroke="#c45e16" stroke-width="1.2"/>
  <circle cx="412" cy="270" r="16" fill="#e07a2f" stroke="#c45e16" stroke-width="1.2"/>
  <circle cx="340" cy="530" r="32" fill="#e8c547" stroke="#c4a01e" stroke-width="1.2"/>
  <text x="268" y="274" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1a</text>
  <text x="412" y="274" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1b</text>
  <text x="340" y="536" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">2</text>

  <text x="340" y="792" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Start &amp; Finish</text>
  <line x1="236" y1="820" x2="448" y2="820" stroke="#1a1a1a" stroke-width="2.4" stroke-dasharray="5 6"/>

  <circle cx="218" cy="820" r="16" fill="#e07a2f" stroke="#c45e16" stroke-width="1.2"/>
  <text x="218" y="858" text-anchor="middle" font-family="Source Sans Pro, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">pin</text>

  <g transform="translate(468,820)">
    <path d="M0,-38 L15,-10 L14,30 Q0,38 -14,30 L-15,-10 Z" fill="#1a1a1a"/>
    <line x1="-16" y1="0" x2="-16" y2="-46" stroke="#1a1a1a" stroke-width="2.2"/>
    <path d="M-16,-46 L-38,-35 L-16,-24 Z" fill="#e07a2f"/>
  </g>
</svg>
